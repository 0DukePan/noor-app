plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

// A release build must never silently ship debug-signed: Play rejects a
// debug-signed AAB, and nothing about the build output says so. Falling back
// to the debug keys is therefore opt-in only
// (`flutter build apk --release --android-project-arg allowDebugSigning=true`),
// which is what CI uses for its throwaway verification APK.
def allowDebugSigning = project.hasProperty('allowDebugSigning') &&
    project.property('allowDebugSigning').toString().toBoolean()

android {
    namespace = "com.noor.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId = "com.noor.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Debug keys are only reachable with the explicit opt-in; the
            // release tasks below fail the build otherwise.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

// Fail the release build (not the configuration, so debug builds and
// `flutter run` keep working without a keystore) when it would ship
// debug-signed without the explicit opt-in.
tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }
    .configureEach {
        doFirst {
            if (!keystorePropertiesFile.exists() && !allowDebugSigning) {
                throw new GradleException(
                    "android/key.properties is missing, so this release build " +
                    "would be signed with the debug key — Google Play rejects " +
                    "that. Create the release keystore first (see " +
                    "docs/store-checklist.md §4), or pass " +
                    "--android-project-arg allowDebugSigning=true for a " +
                    "throwaway debug-signed artifact."
                )
            }
        }
    }

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
