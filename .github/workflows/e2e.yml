name: e2e

# End-to-end suite against the Flutter web release build (same Dart code and
# UI as Android). Deterministic tests only — no model calls, no secrets.
# See e2e/notes.md for why the target is web (mobile engine is blocked on
# upstream Windows daemon bugs) and how to run it locally (`npm run test:e2e`).
on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'tests/**'
      - 'e2e.config.ts'
      - 'e2e/serve-web.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'tests/**'
      - 'e2e.config.ts'
      - 'e2e/serve-web.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'

jobs:
  web:
    name: Web e2e (Mushaf flows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Same pin as CI: an unpinned stable changes rendering underneath
          # the suite.
          flutter-version: 3.44.9
          cache: true

      - name: Build web release
        run: flutter build web --release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx e2e-web install chromium --with-deps

      - name: Run e2e suite
        run: npm run test:e2e

      - name: Upload e2e report (red runs only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            .e2e/report.json
            .e2e/artifacts/
