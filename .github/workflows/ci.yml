name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (with coverage)
        run: flutter test --coverage

      - name: Verify app-wide coverage floor
        run: python3 tools/coverage_summary.py 12

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate prebuilt hadith database
        run: dart run tool/build_hadith_db.dart

      - name: Build release APK (debug-signed fallback)
        run: |
          FLAGS=""
          if [ -n "$SENTRY_DSN" ]; then
            FLAGS="--dart-define=SENTRY_DSN=$SENTRY_DSN"
          fi
          flutter build apk --release $FLAGS
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Report APK size
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          unzip -lv "$APK" | sort -k1 -nr | head -25

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # The first real "the app runs on Android" evidence: boots the full app on
  # an emulator (first-launch DB import + onboarding + all five tabs).
  integration-test:
    name: Integration tests (Android emulator)
    runs-on: ubuntu-latest
    needs: analyze-test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: flutter test integration_test

  # Runs only when the signing secrets are configured (Settings > Secrets).
  build-appbundle:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    needs: analyze-test
    if: secrets.KEYSTORE_BASE64 != ''
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate prebuilt hadith database
        run: dart run tool/build_hadith_db.dart

      - name: Configure signing key
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/noor-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../app/noor-release.jks
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build signed release AAB
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: noor-app-aab
          path: build/app/outputs/bundle/release/app-release.aab
