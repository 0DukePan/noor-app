name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project is developed and verified against
          # (see CHANGELOG). An unpinned `stable` quietly changes text metrics,
          # golden rendering and analyzer rules underneath the suite, which is
          # how a green local run turns into a red CI run.
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # assets/db/hadith.db is gitignored, so a fresh checkout has no corpus and
      # the suite fails on the asset load. Generating it here also means the
      # tests exercise the configuration that actually ships.
      - name: Generate prebuilt hadith database
        run: dart run tool/build_hadith_db.dart

      - name: Verify content checksums (shipped content vs frozen manifest)
        run: dart run tool/verify_content_checksums.dart

      - name: Analyze
        run: flutter analyze

      - name: Test (with coverage)
        # The JSON reporter is what makes a red run triageable: the annotation
        # step below turns every error event into a run annotation, readable on
        # the run page and through the API without downloading logs.
        run: flutter test --coverage --reporter json > test_output.json

      - name: Annotate failing tests
        if: failure()
        run: |
          if [ ! -s test_output.json ]; then
            echo "::error::The test step produced no output; see the step log."
            exit 0
          fi
          # python3, not jq: python3 is already a hard dependency of the gates
          # below, so this step cannot fail on a missing JSON tool. If the file
          # holds no error events (the runner crashed before reporting one),
          # fall back to the raw non-JSON output lines.
          #
          # The error event itself carries only "Test failed. See exception logs
          # above."; the name lives in the matching testStart event and the
          # exception is a separate print event. Naming the test is the
          # difference between "CI is red" and "this test is red" - and on this
          # repo the annotation is the only failure detail readable without
          # admin rights, so losing the name makes a red run untriageable.
          python3 - <<'PY' || true
          import json
          from collections import defaultdict

          names = {}
          printed = defaultdict(list)
          failures = []
          raw = []
          with open('test_output.json', encoding='utf-8', errors='replace') as out:
              for line in out:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      raw.append(line)
                      continue
                  kind = event.get('type')
                  if kind == 'testStart':
                      names[event['test']['id']] = event['test']['name']
                  elif kind == 'print':
                      printed[event.get('testID')].append(event.get('message', ''))
                  elif kind == 'error':
                      test_id = event.get('testID')
                      name = names.get(test_id, '<unknown test>')
                      lines = [m.strip() for m in printed.get(test_id, []) if m.strip()]
                      detail = ' | '.join(lines[:3]) or (event.get('error') or '')
                      failures.append((name, detail))

          reported = failures[:40] or [('', line) for line in raw[:40]]
          for name, detail in reported:
              text = ' '.join(detail.split()).replace('%', '%25')[:400]
              print(f"::error::{name + ': ' if name else ''}{text}")
          PY
          exit 0

      - name: Upload test report (red runs only)
        # The annotation above is truncated by design; the raw JSON is the full
        # picture, and an artifact is downloadable without repository admin.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-json
          path: test_output.json
          if-no-files-found: ignore

      - name: Verify app-wide coverage floor
        # Ratchet, not a suggestion: 30 -> 30.5 (measured 30.95% at 682 tests,
        # 2026-09-18). Staged target 40 -> 50 -> 60 as pages land; see the
        # ratchet plan in docs/coverage-inventory.md.
        run: python3 tools/coverage_summary.py 30.5

      - name: Verify lib/ file-size ceiling
        run: python3 tools/file_size_check.py

      - name: Verify assets size budget
        # 230 MB: tight gate that passes today (221.5 MB after the tafsir
        # SQLite consolidation: 272.2 → 221.5) and fails on any real
        # regression. Ratchet down further once audio delivery moves
        # off-device (streaming/offline packs).
        run: python3 tools/check_assets_size.py 230

      - name: Verify coverage-exclusions budget (10% cap, no silent growth)
        run: python3 tools/check_exclusions.py

      - name: Verify ARB parity (ar/en key sets identical)
        run: python3 tools/check_arb_parity.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      - name: Generate SBOM (CycloneDX)
        # No first-party Dart/Flutter SBOM tool exists; tools/generate_sbom.py
        # walks the locked dependency set into CycloneDX JSON.
        run: python3 tools/generate_sbom.py --output build/sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: build/sbom.cdx.json

  # Supply-chain gate: pubspec.lock scanned against OSV.dev on every push and
  # pull request. Pinned to a release tag; the job fails on any known
  # vulnerability. SARIF upload stays off so the gate does not depend on
  # GitHub code-scanning being enabled for the repository.
  dependency-scan:
    name: Dependency vulnerability scan (OSV)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0"
    with:
      scan-args: |-
        --lockfile=pubspec.lock
      upload-sarif: false

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project is developed and verified against
          # (see CHANGELOG). An unpinned `stable` quietly changes text metrics,
          # golden rendering and analyzer rules underneath the suite, which is
          # how a green local run turns into a red CI run.
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate prebuilt hadith database
        run: dart run tool/build_hadith_db.dart

      - name: Build release APK (debug-signed, verification artifact)
        run: |
          FLAGS=""
          if [ -n "$SENTRY_DSN" ]; then
            FLAGS="--dart-define=SENTRY_DSN=$SENTRY_DSN"
          fi
          # This artifact exists to prove the release build compiles and to be
          # sideloaded for smoke tests. A Play upload uses the signed AAB from
          # the build-appbundle job; the explicit opt-in is what allows a
          # debug-signed release build to pass at all.
          flutter build apk --release $FLAGS \
            --android-project-arg allowDebugSigning=true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Report APK size
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          unzip -lv "$APK" | sort -k1 -nr | head -25

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # The first real "the app runs on Android" evidence: boots the full app on
  # an emulator (first-launch DB import + onboarding + all five tabs).
  integration-test:
    name: Integration tests (Android emulator)
    runs-on: ubuntu-latest
    needs: analyze-test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project is developed and verified against
          # (see CHANGELOG). An unpinned `stable` quietly changes text metrics,
          # golden rendering and analyzer rules underneath the suite, which is
          # how a green local run turns into a red CI run.
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # assets/db/hadith.db is gitignored, so a fresh checkout has no corpus:
      # without this step the emulator exercises the JSON-import fallback with
      # paths that are not bundled, not the configuration that ships.
      - name: Generate prebuilt hadith database
        run: dart run tool/build_hadith_db.dart

      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            # Best-effort offline exercise: the app must boot with no
            # connectivity (the DB copies from bundled assets). A refused
            # toggle must not fail the job — the app itself never requires
            # the network; see docs/offline-first.md.
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            # tee with exit-code preservation, so the benchmark step below can
            # publish the numbers this run actually measured.
            flutter test integration_test > integration_output.log 2>&1
            status=$?
            cat integration_output.log
            exit $status

      - name: Publish startup benchmark numbers
        if: always()
        run: |
          {
            echo "## Startup benchmark (Android emulator)"
            echo ""
            echo "Environment: API 34 / pixel_5 / x86_64, Flutter 3.44.9"
            echo ""
            python3 tools/perf_summary.py integration_output.log || true
          } >> "$GITHUB_STEP_SUMMARY"

  # Signing is optional. `secrets` may NOT be referenced in a job-level `if:`:
  # GitHub then rejects the whole workflow file ("Unrecognized named-value:
  # 'secrets'"), which silently disabled every job in this workflow until
  # 2026-09-13. A tiny gate job exposes a boolean output instead.
  signing-secrets:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: echo "configured=${{ secrets.KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

  # Runs only when the signing secrets are configured (Settings > Secrets).
  build-appbundle:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    needs: [analyze-test, signing-secrets]
    if: needs.signing-secrets.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project is developed and verified against
          # (see CHANGELOG). An unpinned `stable` quietly changes text metrics,
          # golden rendering and analyzer rules underneath the suite, which is
          # how a green local run turns into a red CI run.
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate prebuilt hadith database
        run: dart run tool/build_hadith_db.dart

      - name: Verify content checksums before release
        run: dart run tool/verify_content_checksums.dart

      - name: Configure signing key
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/noor-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../app/noor-release.jks
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build signed release AAB
        run: |
          # Signing is configured above, so the only remaining preflight checks
          # are the bundled DBs, version/changelog, and the scholarly sign-off.
          # The flag keeps this job usable for signing/upload dry-runs while the
          # review rows are still pending; the pre-submission gate in
          # docs/store-checklist.md §9 runs it WITHOUT the flag.
          dart run tool/release_preflight.dart --allow-pending-scholar-review
          flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: noor-app-aab
          path: build/app/outputs/bundle/release/app-release.aab
