name: noor_app
description: A comprehensive Islamic app - Digital worship environment for Quran, Hadith, Prayer, and Adhkar.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # Navigation
  go_router: ^12.0.0
  
  # Local Storage (Offline-First)
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  
  # Backend
  supabase_flutter: ^2.0.0
  
  # Notifications
  firebase_messaging: ^15.2.0
  firebase_core: ^3.10.0
  flutter_local_notifications: ^18.0.0
  
  # Location & Sensors
  geolocator: ^10.1.0
  flutter_compass: ^0.8.0
  sensors_plus: ^4.0.0
  
  # Camera (for AR Qibla)
  camera: ^0.10.5
  
  # Prayer Times
  adhan: ^2.0.0
  
  # Security
  encrypt: ^5.0.1
  flutter_secure_storage: ^9.0.0
  
  # Typography & UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.2.0
  http: ^1.1.0
  path: ^1.8.0
  
  # Audio Player (Quran Recitation)
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  just_audio_background: ^0.0.1-beta.11
  audio_session: ^0.1.18
  
  # Permissions
  permission_handler: ^11.0.0
  
  # Timezone
  timezone: ^0.9.2

  
  # Home Screen Widgets
  home_widget: ^0.7.0
  
  # Sharing & Export
  share_plus: ^7.2.0
  pdf: ^3.10.0
  printing: ^5.11.0
  
  # Charts (Statistics)
  fl_chart: ^0.65.0
  
  # Observability (Crashes only - no user tracking)
  sentry_flutter: ^7.14.0
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  package_info_plus: ^8.2.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/quran/
    - assets/hadith/
    - assets/hadith/by_book/the_9_books/
    - assets/hadith/by_book/forties/
    - assets/hadith/by_book/other_books/
    - assets/adhkar/
    - assets/fonts/
    - assets/images/
    - assets/tafsir/muyassar/ar-tafsir-muyassar/
    - assets/tafsir/ibn_kathir/full/ar-tafsir-ibn-kathir/
    - assets/tafsir/saadi/ar-tafseer-al-saddi/
    - assets/tafsir/tabari/ar-tafsir-al-tabari/
  
  # fonts:
  #   - family: AmiriQuran
  #     fonts:
  #       - asset: assets/fonts/AmiriQuran-Regular.ttf
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
