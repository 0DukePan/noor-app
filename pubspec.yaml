name: noor_app
description: A comprehensive Islamic app - Digital worship environment for Quran, Hadith, Prayer, and Adhkar.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # Prayer Times
  adhan: ^2.0.0

  # Audio Player (Quran Recitation)
  audio_service: ^0.18.12
  audio_session: ^0.1.18

  # Camera (for AR Qibla)
  camera: ^0.10.5

  # Utilities
  dartz: ^0.10.1
  encrypt: ^5.0.1
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_compass: ^0.8.0
  flutter_local_notifications: ^18.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  flutter_secure_storage: ^9.0.0
  flutter_svg: ^2.0.9
  geocoding: ^4.0.0
  geolocator: ^10.1.0
  go_router: ^12.0.0
  google_fonts: 8.2.1
  hijri: ^3.0.0
  hive_flutter: ^1.1.0
  home_widget: ^0.7.0
  http: ^1.1.0
  intl: ^0.20.2
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11
  package_info_plus: ^8.2.0
  path: ^1.8.0
  path_provider: ^2.1.0
  pdf: ^3.10.0
  permission_handler: ^11.0.0
  printing: ^5.11.0
  sensors_plus: ^4.0.0
  sentry_flutter: ^7.14.0
  share_plus: ^7.2.0
  sqflite: ^2.3.0
  sqflite_common: ^2.5.0
  timezone: ^0.9.2
  url_launcher: ^6.3.1
  uuid: ^4.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.2
  very_good_analysis: ^7.0.0

dependency_overrides:
  package_info_plus: ^8.2.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#107A57"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F0E5D3"
  image: assets/icon/app_icon.png
  android_12:
    color: "#F0E5D3"
    image: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  
  assets:
    - assets/quran/
    - assets/hadith/
    - assets/db/
    - assets/adhkar/
    - assets/quran/translations/
    - assets/fonts/
    - assets/images/
    - assets/tafsir/muyassar/ar-tafsir-muyassar/
    - assets/tafsir/ibn_kathir/full/ar-tafsir-ibn-kathir/
    - assets/tafsir/saadi/ar-tafseer-al-saddi/
    - assets/tafsir/tabari/ar-tafsir-al-tabari/
  
  # fonts:
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
