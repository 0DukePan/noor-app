name: noor_app
description: A comprehensive Islamic app - Digital worship environment for Quran, Hadith, Prayer, and Adhkar.
publish_to: 'none'
version: 1.0.0+2

environment:
  # SDK floor: the first releases containing the fix for CVE-2026-27704
  # (path traversal during pub package extraction). Documented in SECURITY.md.
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  # Prayer Times
  adhan: ^2.0.0

  # Audio Player (Quran Recitation)
  audio_session: ^0.1.18

  # Utilities
  clock: ^1.1.1
  crypto: ^3.0.3
  dartz: ^0.10.1
  encrypt: ^5.0.1
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_compass: ^0.8.0
  flutter_local_notifications: ^18.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  flutter_secure_storage: ^9.0.0
  geocoding: ^4.0.0
  geolocator: ^10.1.0
  go_router: ^12.0.0
  google_fonts: 8.2.1
  hijri: ^3.0.0
  hive_flutter: ^1.1.0
  home_widget: ^0.7.0
  http: ^1.1.0
  intl: ^0.20.2
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11
  package_info_plus: ^8.2.0
  path: ^1.8.0
  path_provider: ^2.1.0
  pdf: ^3.10.0
  permission_handler: ^11.0.0
  printing: ^5.11.0
  sentry_flutter: ^8.14.2
  share_plus: ^7.2.0
  sqflite: ^2.3.0
  sqflite_common: ^2.5.0
  timezone: ^0.9.2
  uuid: ^4.2.0
dev_dependencies:
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  # Animated-GIF encoder for the README capture harness (tool/readme_capture).
  # Already in the lockfile transitively via pdf/printing.
  image: ^4.5.4
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.2
  very_good_analysis: ^7.0.0

dependency_overrides:
  package_info_plus: ^8.2.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#107A57"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F0E5D3"
  image: assets/icon/app_icon.png
  android_12:
    color: "#F0E5D3"
    image: assets/icon/app_icon.png

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/quran/
    - assets/hadith/
    - assets/db/
    - assets/adhkar/
    - assets/quran/translations/
    - assets/fonts/
    - assets/images/
  
  # fonts:
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
